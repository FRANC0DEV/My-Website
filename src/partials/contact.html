      <section
        class="px-[5%] py-10 flex flex-col gap-2 xl:flex-row xl:gap-5 items-center"
      >
        <form
          id="contact-form"
          class="order-2 xl:order-1 space-y-4 flex-none xl:w-1/2"
          novalidate
        >
          <div class="space-y-2">
            <h2
              class="font-juliusSansOne text-4xl xl:text-5xl text-principal-700 text-center xl:text-left"
              data-lang-es="¡Estemos en Contacto!"
            >
              Let's be in contact!
            </h2>
            <p
              class="font-quicksand text-lg text-principal-700 text-center xl:text-left"
              data-lang-es="Llena los campos obligatorios (*) para que pueda contactarme contigo lo más pronto posible."
            >
              Fill out the required fields (*) so I can contact you as soon as
              I'm available.
            </p>
          </div>
          <ul class="space-y-4">
            <!--Name-->
            <li class="flex flex-col relative">
              <label
                for="form-contact-name"
                id="form-contact-name-label"
                class="font-quicksand font-semibold text-[14px] text-principal-600 [&.error]:text-red-600 peer/label"
                data-lang-es="Nombre (*)"
                >Name (*)</label
              >
              <input
                type="text"
                name="form-contact-name"
                id="form-contact-name"
                aria-required="true"
                aria-invalid="false"
                aria-labelledby="form-contact-name-label"
                class="w-full border-b-2 border-principal-400 outline-none bg-transparent transition-colors min-h-10 font-quicksand text-[18px] text-principal-800 peer/input peer-[.error]/label:border-red-300"
                placeholder="Enter your full name"
                data-lang-es-placeholder="Ingresa tu nombre completo"
              />
              <span
                class="absolute bottom-0 left-1/2 border-b-2 w-0 border-principal-800 transition-all duration-400 ease-out -translate-x-1/2 peer-focus/input:w-full peer-[.error]/label:border-red-500"
              ></span>
            </li>
            <!--Email-->
            <li class="flex flex-col relative">
              <label
                id="form-contact-email-label"
                for="form-contact-email"
                class="font-quicksand font-semibold text-[14px] text-principal-600 [&.error]:text-red-600 peer/label"
                data-lang-es="Correo Electrónico (*)"
                >Email (*)</label
              >
              <input
                type="email"
                name="form-contact-email"
                id="form-contact-email"
                aria-required="true"
                aria-invalid="false"
                aria-labelledby="form-contact-email-label"
                class="w-full border-b-2 border-principal-400 outline-none bg-transparent transition-colors min-h-10 font-quicksand text-[18px] text-principal-800 peer/input peer-[.error]/label:border-red-300"
                placeholder="Enter a valid email address"
                data-lang-es-placeholder="Introduce to correo"
              />
              <span
                class="absolute bottom-0 left-1/2 border-b-2 w-0 border-principal-800 transition-all duration-400 ease-out -translate-x-1/2 peer-focus/input:w-full peer-[.error]/label:border-red-500"
              ></span>
            </li>
            <!--Message-->
            <li class="flex flex-col relative">
              <label
                id="form-contact-message-label"
                for="form-contact-message"
                class="font-quicksand font-semibold text-[14px] text-principal-600 [&.error]:text-red-600 peer/label"
                data-lang-es="Mensaje (*)"
                >Message (*)</label
              >
              <textarea
                name="form-contact-message"
                id="form-contact-message"
                aria-required="true"
                aria-invalid="false"
                aria-labelledby="form-contact-message-label"
                maxlength="600"
                class="w-full outline-none bg-transparent font-quicksand text-[16px] text-principal-800 resize-y pb-10 peer/input"
                rows="7"
                placeholder="Enter your message"
                data-lang-es-placeholder="Ingresa tu mensaje"
              ></textarea>
              <span
                class="absolute -bottom-1 left-0 border-b-2 border-principal-400 w-full peer-[.error]/label:border-red-300"
              ></span>
              <span
                class="absolute -bottom-1 left-1/2 border-b-2 w-0 border-principal-800 transition-all duration-400 ease-out -translate-x-1/2 peer-focus/input:w-full peer-[.error]/label:border-red-500"
              ></span>
            </li>
          </ul>
          <button
            type="submit"
            class="rounded-sm bg-principal-800 text-principal-50 font-quicksand font-semibold text-[14px] p-4 w-full cursor-pointer hover:bg-principal-700 outline-none focus:bg-principal-700 focus:ring-2 focus:ring-principal-500 focus:ring-offset-2 disabled:bg-principal-600 disabled:text-principal-100 disabled:cursor-progress"
            id="contact-form-submit-button"
            data-lang-es="Enviar mensaje"
          >
            Submit
          </button>
        </form>
        <canvas
          class="flex-[0_1_auto] max-w-full xl:w-1/2 aspect-square order-1 xl:order-2"
          id="dotlottie-canvas"
        >
        </canvas>
      </section>
