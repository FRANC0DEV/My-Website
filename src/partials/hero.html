      <section
        class="h-[calc(100dvh-51.34px)] relative flex flex-col"
        aria-labelledby="hero-title"
      >
        <div
          class="flex-1 relative z-10 flex flex-col items-center justify-between"
        >
          <!--Text-->
          <div
            class="flex flex-1 flex-col justify-center lg:justify-center gap-y-10 landscape:gap-y-0 lg:landscape:gap-y-10"
          >
            <h1
              class="flex flex-col leading-none text-center text-principal-800"
              id="hero-title"
            >
              <span
                class="font-quicksand font-light not-landscape:text-[7dvh] landscape:text-[7dvw] lg:landscape:text-[3dvw] opacity-0 animate-[fadeIn_0.5s_linear_forwards]"
                data-lang-es="Soy"
                >I'm</span
              >
              <span
                class="font-norse not-landscape:text-[14dvh] landscape:text-[20dvw] lg:landscape:text-[16dvw]"
              >
                <div
                  class="inline-flex flex-wrap gap-x-[0.5ch] wrap-anywhere justify-center leading-none"
                  id="my-name"
                >
                  <div class="inline-flex flex-nowrap gap-0">
                    <span class="opacity-0">E</span>
                    <span class="opacity-0">D</span>
                    <span class="opacity-0">G</span>
                    <span class="opacity-0">A</span>
                    <span class="opacity-0">R</span>
                  </div>
                  <!-- &nbsp; -->
                  <div class="flex flex-nowrap gap-0">
                    <span class="opacity-0">F</span>
                    <span class="opacity-0">R</span>
                    <span class="opacity-0">A</span>
                    <span class="opacity-0">N</span>
                    <span class="opacity-0">C</span>
                    <span class="opacity-0">O</span>
                  </div>
                </div>
              </span>
            </h1>
            <h2
              class="font-quicksand text-principal-800 font-light text-center not-landscape:text-[4dvh] landscape:text-[5dvw] lg:landscape:text-[3dvw] opacity-0 animate-[fadeIn_0.3s_2s_linear_forwards]"
              data-lang-es="&lt;Desarrollador Full Stack/&gt;"
            >
              &lt;Full Stack Developer/&gt;
            </h2>
            <!--Download CV (href follows the selected language via i18n)-->
            <a
              href="%BASE_URL%/cv/edgar-franco-cv-en.pdf"
              data-lang-es-href="%BASE_URL%/cv/edgar-franco-cv-es.pdf"
              download="Edgar-Franco-Leiva-Chavez-CV.pdf"
              aria-label="Download CV (English)"
              data-lang-es-aria-label="Descargar CV (español)"
              class="mx-auto inline-flex cursor-pointer items-center gap-2 rounded-sm bg-principal-800 px-6 py-3 font-quicksand text-[15px] font-semibold text-principal-50 outline-none transition-all duration-300 hover:-translate-y-0.5 hover:bg-principal-700 hover:shadow-[0_5px_15px_0_hsla(0,0%,0%,0.25)] opacity-0 animate-[fadeIn_0.5s_2.5s_linear_forwards] focus:bg-principal-700 focus:ring-2 focus:ring-principal-500 focus:ring-offset-2"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-download aspect-square stroke-current fill-none stroke-2 w-5"
              >
                <path d="M12 15V3" />
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="m7 10 5 5 5-5" />
              </svg>
              <span data-lang-es="Descargar CV">Download CV</span>
            </a>
          </div>
          <!-- </div> -->
          <!--Grass container-->
          <div
            class="w-full h-12 animate-grass-appear"
            style="
              background-image: url(&quot;/src/assets/svgs/grass-light.svg&quot;);
              background-repeat: repeat-x;
            "
            aria-hidden="true"
          ></div>
        </div>

        <!--Wind Canvas-->
        <canvas
          id="wind-canvas"
          width="900"
          height="600"
          class="hidden lg:block absolute w-full h-full top-0 left-0 pointer-events-none"
          aria-hidden="true"
        >
        </canvas>
      </section>
