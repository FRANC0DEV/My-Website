<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Edgar Franco" />
    <meta
      name="description"
      content="Hi! I'm Edgar and here you'll find information about my career as a frontend developer, projects, abilities and more!"
    />
    <meta name="theme-color" content="#222222" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Edgar Franco - Full Stack Developer" />
    <meta
      property="og:description"
      content="Frontend and Full Stack Developer portfolio. Explore my projects, skills, and experience."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Edgar Franco - Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Frontend and Full Stack Developer portfolio"
    />
    <meta
      property="og:image"
      content="https://edgarfranco.vercel.app/website.png"
    />
    <!--fonts-->
    <!-- Google Fonts - Plugin will download and optimize these -->
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;700&family=Open+Sans:wght@400&family=Julius+Sans+One:wght@400&display=swap"
      rel="stylesheet"
    />
    <!-- Preload Norse font FIRST -->
    <link
      rel="preload"
      href="/src/assets/fonts/Norse.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <!-- Preload grass image -->
    <link
      rel="preload"
      href="/src/assets/svgs/grass-light.svg"
      as="image"
      type="image/svg+xml"
      fetchpriority="high"
    />
    <!-- Light theme favicon (icon that will appear on Bookmarks) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="src/assets/svgs/logo.svg"
      media="(prefers-color-scheme: light)"
    />
    <!-- Dark theme favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="src/assets/svgs/logo.svg"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Canonical URL (update with your actual domain) -->
    <link rel="canonical" href="https://edgarfranco.com" />
    <!--Title of the page-->
    <title>Edgar Franco - Full Stack Developer | Portfolio</title>
  </head>
  <body id="top">
    <!--Content that displays on the page-->
    <!--#include partial="header.html"-->
    <main>
      <!--Hero Section-->
      <!--#include partial="hero.html"-->
      <!--Skills & Technologies Section-->
      <section
        id="skills-and-technologies"
        aria-labelledby="skills-heading"
        class="min-h-screen flex flex-col justify-between"
      >
        <!--#include partial="skills.html"-->
        <!--#include partial="process.html"-->
      </section>
      <!--Projects & Experience-->
      <!-- Fixed height on desktop so both columns end at the same bottom line:
           each column distributes its inner space with flex, and the scrollable
           region stretches to fill whatever is left under its heading. -->
      <section
        class="px-[5%] py-10 bg-principal-200 flex flex-col gap-8 xl:h-[85dvh] xl:flex-row"
        aria-label="Experience and projects"
        data-lang-es-aria-label="Experiencia y proyectos"
      >
        <!--#include partial="experience.html"-->
        <!--#include partial="projects.html"-->
      </section>
      <!--#include partial="certificates.html"-->
      <!--Contact Me-->
      <!--#include partial="contact.html"-->
    </main>
    <!--#include partial="footer.html"-->
    <script type="module" src="./src/functions/main.ts"></script>
  </body>
</html>
